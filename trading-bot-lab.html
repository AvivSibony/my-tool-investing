<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap');
:root{--bg:#eef2f5;--card:#fff;--ink:#14232e;--mute:#5d6f7c;--line:#d5dde3;--brand:#0f4c5c;--up:#1b7f4b;--down:#b3261e;--warn:#9a5b00;--warnbg:#fff1d6;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1a22;--card:#16262f;--ink:#e6eef3;--mute:#93a6b3;--line:#27404d;--brand:#6cc4d6;--up:#4cc58a;--down:#ff8a80;--warn:#ffcc80;--warnbg:#3a2c10;--on:#0e1a22}}
*{box-sizing:border-box}html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-size:15px}
main{max-width:560px;margin:auto;padding:12px 14px 40px}
h1{font-size:21px;font-weight:800;margin:4px 0 8px}h2{font-size:16px;font-weight:800;margin:0 0 6px}
.card{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(20,35,46,.08)}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px;direction:ltr}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--brand);color:var(--on);width:100%}
.btn.s{background:none;color:var(--brand);border:1px solid var(--brand)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mute{color:var(--mute);font-size:13px}.up{color:var(--up)}.down{color:var(--down)}
.big{font-size:24px;font-weight:800}.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
.alert{background:var(--down);color:var(--on);border-radius:10px;padding:10px 12px;margin-bottom:10px;font-weight:600}
.lg span{display:inline-block;margin-inline-end:12px;font-size:12px}
</style>

<body>
<main>
<h1>מעבדת בוט מסחר</h1>
<div class="banner">חשבון דמו בלבד, בלי כסף אמיתי. הבדיקה רצה על נתוני עבר או נתונים סינתטיים, ותוצאות עבר אינן מבטיחות תוצאות עתידיות. אין כאן ייעוץ השקעות.</div>

<div class="card"><h2>1. נתונים</h2>
<label for="sc">מקור</label>
<select id="sc"><option value="up">סינתטי: שוק עולה</option><option value="down">סינתטי: שוק יורד</option><option value="side">סינתטי: שוק צדדי</option><option value="vol">סינתטי: תנודתי מאוד</option><option value="csv">הדבקת נתונים שלי</option></select>
<div id="synth"><label for="seed">מספר זרע (אותו מספר = אותם נתונים)</label><input id="seed" type="number" value="7"></div>
<div id="csvb" hidden><label for="csv">הדבק מחירי סגירה, שורה לכל יום: תאריך,מחיר (או מחיר בלבד)</label><textarea id="csv" placeholder="2025-01-02,101.5"></textarea><div class="mute">מחירים אמיתיים אפשר לייצא מ-Yahoo Finance או מאתר הברוקר. האפליקציה לא מורידה נתונים בעצמה.</div></div></div>

<div class="card"><h2>2. אסטרטגיה</h2>
<select id="st" aria-label="אסטרטגיה"></select><div class="mute" id="desc"></div><div class="g" id="sp"></div></div>

<div class="card"><h2>3. ניהול סיכונים</h2><div class="g" id="rk"></div></div>

<button class="btn" id="go">הרץ בדיקה</button>
<button class="btn s" id="cmp" style="margin-top:8px">השווה את כל האסטרטגיות</button>
<button class="btn s" id="rs" style="margin-top:8px">איפוס הגדרות</button>
<div id="out" style="margin-top:12px" aria-live="polite"></div>
</main>
<script>
const $=id=>document.getElementById(id),f=(x,d=2)=>Number(x).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const sma=(a,n,i)=>i+1<n?null:a.slice(i+1-n,i+1).reduce((x,y)=>x+y,0)/n;
function rsi(a,n,i){if(i<n)return null;let g=0,l=0;for(let k=i-n+1;k<=i;k++){const d=a[k]-a[k-1];d>0?g+=d:l-=d}return l==0?100:100-100/(1+g/l)}
const ST={
sma:{n:'ממוצעים נעים',d:'קונה כשהממוצע המהיר חוצה כלפי מעלה את האיטי, ומוכר בחצייה ההפוכה.',p:[['fast','ממוצע מהיר (ימים)',20],['slow','ממוצע איטי (ימים)',50]],sig:(c,i,P)=>{const a=sma(c,P.fast,i),b=sma(c,P.slow,i),x=sma(c,P.fast,i-1),y=sma(c,P.slow,i-1);if([a,b,x,y].includes(null))return;if(x<=y&&a>b)return'buy';if(x>=y&&a<b)return'sell'}},
rsi:{n:'RSI היפוך',d:'קונה אחרי ירידה חדה (RSI נמוך) ומוכר אחרי עלייה חדה (RSI גבוה).',p:[['n','תקופה',14],['lo','קנייה מתחת ל-',30],['hi','מכירה מעל',70]],sig:(c,i,P)=>{const r=rsi(c,P.n,i);if(r==null)return;if(r<P.lo)return'buy';if(r>P.hi)return'sell'}},
brk:{n:'פריצת שיא',d:'קונה כשהמחיר עובר את השיא של N ימים, ויוצא כשהוא יורד מתחת לשפל של X ימים.',p:[['n','ימי שיא',20],['x','ימי יציאה',10]],sig:(c,i,P)=>{if(i<P.n)return;if(c[i]>Math.max(...c.slice(i-P.n,i)))return'buy';if(c[i]<Math.min(...c.slice(i-P.x,i)))return'sell'}},
bb:{n:'בולינגר',d:'קונה כשהמחיר נמוך בהרבה מהממוצע (K סטיות תקן), ומוכר כשהוא חוזר מעל הממוצע.',p:[['n','תקופה (ימים)',20],['k','סטיות תקן',2]],sig:(c,i,P)=>{const m=sma(c,P.n,i);if(m==null)return;const s=Math.sqrt(c.slice(i+1-P.n,i+1).reduce((a,v)=>a+(v-m)**2,0)/P.n);if(c[i]<m-P.k*s)return'buy';if(c[i]>m)return'sell'}},
mom:{n:'מומנטום',d:'קונה כשהמחיר עלה יותר מהסף בתקופה האחרונה, ומוכר כשהמגמה מתהפכת לשלילית.',p:[['n','תקופה (ימים)',60],['th','סף עלייה (%)',5]],sig:(c,i,P)=>{if(i<P.n)return;const r=(c[i]/c[i-P.n]-1)*100;if(r>P.th)return'buy';if(r<0)return'sell'}},
bh:{n:'קנה והחזק (להשוואה)',d:'קונה ביום הראשון ומחזיק. משמש מדד השוואה.',p:[],sig:(c,i)=>i==0?'buy':undefined}};
const RK=[['cash','סכום התחלתי ($)',100000],['risk','סיכון לעסקה (% מהתיק)',1],['stop','Stop Loss (%)',5],['tp','Take Profit (%, 0 = כבוי)',0],['maxl','עצירה בהפסד תיק של (%)',10],['fee','עמלה (%)',0.05],['fx','עמלה קבועה ($)',1],['slip','Slippage (%)',0.05]];
function gen(sc,seed,n=500){let s=seed>>>0;const r=()=>{s+=0x6D2B79F5;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};const g=()=>Math.sqrt(-2*Math.log(r()+1e-12))*Math.cos(6.2832*r());const mu={up:.0007,down:-.0006,side:0,vol:.0002}[sc],sd={up:.01,down:.012,side:.008,vol:.025}[sc];let p=100,o=[];for(let i=0;i<n;i++){p*=1+mu+(sc=='side'?.0008*Math.sin(i/12):0)+sd*g();o.push(p)}return o}
function run(c,key,P,R){const st=ST[key],t=[];let cash=R.cash,q=0,en=0,sig=null,halt=false,eq=[];
const buy=(i,p,n)=>{const x=p*(1+R.slip/100);n=Math.floor(n);while(n>0&&n*x*(1+R.fee/100)+R.fx>cash)n--;if(n<=0)return;const fe=R.fx+n*x*R.fee/100;cash-=n*x+fe;q=n;en=x;t.push({d:i+1,s:'קנייה',q:n,p:x,pnl:null,w:''})};
const sell=(i,p,w)=>{if(!q)return;const x=p*(1-R.slip/100),fe=R.fx+q*x*R.fee/100,pnl=q*(x-en)-fe;cash+=q*x-fe;t.push({d:i+1,s:'מכירה',q,p:x,pnl,w});q=0};
for(let i=0;i<c.length;i++){const p=c[i];
if(sig=='buy'&&!q&&!halt)buy(i,p,key=='bh'?cash/p:(cash+q*p)*R.risk/100/(p*R.stop/100));else if(sig=='sell')sell(i,p,'סיגנל');sig=null;
if(q&&key!='bh'){if(p<=en*(1-R.stop/100))sell(i,p,'Stop Loss');else if(R.tp>0&&p>=en*(1+R.tp/100))sell(i,p,'Take Profit')}
if(!halt&&key!='bh'&&cash+q*p<R.cash*(1-R.maxl/100)){sell(i,p,'עצירת חירום');halt=true}
const s=st.sig(c,i,P);if(s&&!(s=='buy'&&q)&&!(s=='sell'&&!q))sig=s;
eq.push(cash+q*p)}
return{t,eq,halt}}
const mdd=e=>{let pk=e[0],d=0;for(const v of e){pk=Math.max(pk,v);d=Math.max(d,(pk-v)/pk)}return d};
function stats(r,R){const e=r.eq,sl=r.t.filter(x=>x.s=='מכירה'),w=sl.filter(x=>x.pnl>0).length;return{ret:(e[e.length-1]/R.cash-1)*100,dd:mdd(e)*100,n:sl.length,wr:sl.length?w/sl.length*100:0,end:e[e.length-1]}}
function readCfg(){const P={},R={};for(const k in ST)for(const[a,,d]of ST[k].p){const el=$('p_'+k+'_'+a);if(el&&el.value!=='')P[k+a]=+el.value}
RK.forEach(([a])=>R[a]=+$('r_'+a).value);return{P,R}}
function pOf(k,P){const o={};ST[k].p.forEach(([a,,d])=>o[a]=P[k+a]??d);return o}
function getData(){if($('sc').value=='csv'){const v=$('csv').value.split(/\n/).map(l=>parseFloat(l.split(',').pop())).filter(x=>x>0);if(v.length<60)throw'צריך לפחות 60 ימי מסחר בנתונים שהדבקת.';return v}return gen($('sc').value,+$('seed').value||1)}
function chart(a,b){const all=a.concat(b),mn=Math.min(...all),mx=Math.max(...all),pt=s=>s.map((v,i)=>(i/(s.length-1)*300).toFixed(1)+','+(112-(v-mn)/(mx-mn||1)*104).toFixed(1)).join(' ');
return`<svg viewBox="0 0 300 120" width="100%" role="img" aria-label="גרף שווי התיק"><polyline fill="none" stroke="var(--mute)" stroke-width="1.5" stroke-dasharray="4 3" points="${pt(b)}"/><polyline fill="none" stroke="var(--brand)" stroke-width="2.2" points="${pt(a)}"/></svg><div class="lg"><span style="color:var(--brand)">▬ הבוט</span><span class="mute">╌ קנה והחזק</span></div>`}
function save(){try{localStorage.setItem('tbl',JSON.stringify({sc:$('sc').value,seed:$('seed').value,csv:$('csv').value,st:$('st').value,...readCfg()}))}catch(e){}}
$('go').onclick=()=>{try{const c=getData(),{P,R}=readCfg(),k=$('st').value,r=run(c,k,pOf(k,P),R),s=stats(r,R),b=run(c,'bh',{},R),sb=stats(b,R);save();
$('out').innerHTML=(r.halt?`<div class="alert" role="alert">התראה: התיק ירד מעבר להפסד המקסימלי (${R.maxl}%), הבוט נעצר ומכר.</div>`:'')+
`<div class="card"><div class="mute">שווי סופי</div><div class="big n">$${f(s.end)}</div><div class="n ${s.ret>=0?'up':'down'}">${s.ret>=0?'+':''}${f(s.ret)}% · קנה והחזק: ${sb.ret>=0?'+':''}${f(sb.ret)}%</div>${chart(r.eq,b.eq)}<div class="g mute"><div>ירידה מקסימלית: <b class="n">${f(s.dd,1)}%</b></div><div>עסקאות שנסגרו: <b>${s.n}</b></div><div>אחוז ברווח: <b>${f(s.wr,0)}%</b></div><div>ימים: <b>${c.length}</b></div></div></div>
<div class="card sc"><h2>עסקאות אחרונות</h2>${r.t.length?`<table><tr><th>יום</th><th>פעולה</th><th>כמות</th><th>מחיר</th><th>ר/ה</th><th>סיבה</th></tr>${r.t.slice(-12).map(x=>`<tr><td>${x.d}</td><td>${x.s}</td><td class="n">${x.q}</td><td class="n">${f(x.p)}</td><td class="n ${x.pnl>0?'up':x.pnl<0?'down':''}">${x.pnl==null?'':f(x.pnl)}</td><td>${x.w}</td></tr>`).join('')}</table>`:'<div class="mute">הבוט לא ביצע עסקאות בנתונים האלה.</div>'}</div>`}catch(e){$('out').innerHTML=`<div class="alert" role="alert">${e}</div>`}};
$('cmp').onclick=()=>{try{const c=getData(),{P,R}=readCfg();save();$('out').innerHTML=`<div class="card sc"><h2>השוואת אסטרטגיות</h2><table><tr><th>אסטרטגיה</th><th>תשואה</th><th>ירידה מקס׳</th><th>עסקאות</th><th>ברווח</th></tr>${Object.keys(ST).map(k=>{const r=run(c,k,pOf(k,P),R),s=stats(r,R);return`<tr><td>${ST[k].n}${r.halt?' ⚠':''}</td><td class="n ${s.ret>=0?'up':'down'}">${f(s.ret)}%</td><td class="n">${f(s.dd,1)}%</td><td>${s.n}</td><td>${f(s.wr,0)}%</td></tr>`}).join('')}</table><div class="mute">⚠ = הבוט נעצר בהפסד מקסימלי. אסטרטגיה טובה על נתונים אחד לא בהכרח טובה על אחרים: נסו כמה מספרי זרע.</div></div>`}catch(e){$('out').innerHTML=`<div class="alert" role="alert">${e}</div>`}};
function params(){const k=$('st').value;$('desc').textContent=ST[k].d;$('sp').innerHTML=ST[k].p.map(([a,l,d])=>`<div><label for="p_${k}_${a}">${l}</label><input id="p_${k}_${a}" type="number" value="${(saved.P||{})[k+a]??d}"></div>`).join('')}
function view(){const c=$('sc').value=='csv';$('csvb').hidden=!c;$('synth').hidden=c}
let saved={};try{saved=JSON.parse(localStorage.getItem('tbl')||'{}')}catch(e){}
$('st').innerHTML=Object.keys(ST).filter(k=>k!='bh').map(k=>`<option value="${k}">${ST[k].n}</option>`).join('');
$('rk').innerHTML=RK.map(([a,l,d])=>`<div><label for="r_${a}">${l}</label><input id="r_${a}" type="number" step="any" value="${(saved.R||{})[a]??d}"></div>`).join('');
if(saved.sc)$('sc').value=saved.sc;if(saved.seed)$('seed').value=saved.seed;if(saved.csv)$('csv').value=saved.csv;if(saved.st)$('st').value=saved.st;
$('sc').onchange=view;$('st').onchange=params;$('rs').onclick=()=>{try{localStorage.removeItem('tbl')}catch(e){}location.reload()};
view();params();
</script>
</body>
</html>
